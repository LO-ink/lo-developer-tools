name: Publish LO npm packages
description: Publish new package versions through npm Trusted Publishing after repository checks.
inputs:
  package-paths:
    description: JSON array of package directories, in dependency order.
    default: '["."]'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        package-manager-cache: false
        node-version: "24"
    - name: Install npm with OIDC support
      shell: bash
      run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org
    - name: Install locked dependencies
      shell: bash
      run: npm ci
    - name: Publish new versions
      shell: bash
      env:
        LO_RELEASE_ACTION_PATH: ${{ github.action_path }}
        LO_RELEASE_PACKAGE_PATHS: ${{ inputs.package-paths }}
      run: node "$LO_RELEASE_ACTION_PATH/publish.mjs"
